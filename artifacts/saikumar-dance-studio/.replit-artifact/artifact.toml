kind = "web"
previewPath = "/"
title = "Heart Beaters - Dance Studio"
description = "A premium, cinematic website for Saikumar Dance Studio with class discovery, studio story, social links, WhatsApp contact, and click-to-call actions."
version = "1.0.0"
id = "artifacts/saikumar-dance-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20460

[services.development]
run = "pnpm --filter @workspace/saikumar-dance-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/saikumar-dance-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/saikumar-dance-studio/dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20460"
BASE_PATH = "/"
